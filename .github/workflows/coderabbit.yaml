name: CodeRabbit Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  coderabbit:
    runs-on: ubuntu-latest
    name: CodeRabbit Review
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CodeRabbit
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}