name: CodeRabbit Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  coderabbit:
    runs-on: ubuntu-latest
    name: CodeRabbit Review
    steps:
      - name: Run CodeRabbit
        uses: coderabbitai/ai-pr-reviewer@1.16.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Optional: CodeRabbit API key for advanced features
          # coderabbit-token: ${{ secrets.CODERABBIT_TOKEN }}