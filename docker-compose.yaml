# ============================================================================
# Docker Compose Configuration for Local Development
# ============================================================================
# Usage:
#   docker-compose up                 # Start all services
#   docker-compose down               # Stop all services
#   docker-compose logs -f ingestion  # View logs for specific service
# ============================================================================

version: '3.9'

services:
  # ========================================================================== 
  # POSTGRESQL DATABASE
  # ========================================================================== 
  postgres:
    image: postgres:15-alpine
    container_name: dota2_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dota2_network

  # ========================================================================== 
  # MONGODB NOSQL DATABASE
  # ========================================================================== 
  mongodb:
    image: mongo:6.0-alpine
    container_name: dota2_mongodb
    env_file:
      - .env
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dota2_network
    command: mongod --auth

  # ========================================================================== 
  # REDIS CACHE
  # ========================================================================== 
  redis:
    image: redis:7-alpine
    container_name: dota2_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dota2_network
    command: redis-server --appendonly yes

  # ========================================================================== 
  # DATA INGESTION SERVICE
  # ========================================================================== 
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dota2_ingestion
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - dota2_network
    restart: unless-stopped

  # ==========================================================================
  # REFERENCE DATA SERVICE (placeholder for Phase 2)
  # ==========================================================================
  # reference_data:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: dota2_reference_data
  #   ports:
  #     - "8002:8002"
  #   depends_on:
  #     - mongodb
  #     - postgres
  #   networks:
  #     - dota2_network

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  dota2_network:
    driver: bridge
