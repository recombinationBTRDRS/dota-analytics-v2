[tool.poetry]
name = "dota2-analytics-v2"
version = "1.0.0"
description = "DOTA 2 Analytics Platform v2.0 - Match analysis and recommendations"
authors = ["Your Name <your@email.com>"]
readme = "README.md"
packages = [
    { include = "services" }
]

[tool.poetry.dependencies]
python = "^3.11"

# HTTP Client
httpx = "^0.27.0"
pytest-httpx = "^0.30.0"

# Web Framework
fastapi = "^0.115.0"
uvicorn = {version = "^0.29.0", extras = ["standard"]}

# Data Validation
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"

# Database
sqlalchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
pymongo = "^4.6.0"
motor = "^3.3.2"

# Cache
redis = "=4.2.0"

# Async
asyncio = "^3.4.3"

# Logging
structlog = "^24.1.0"
python-json-logger = "^2.0.7"

# Task Scheduling
apscheduler = "^3.10.4"

# Testing
pytest = "^7.4.3"
pytest-asyncio = "^0.23.2"
pytest-cov = "^4.1.0"

# Code Quality
ruff = "^0.2.0"
mypy = "^1.8.0"
black = "^24.1.1"

# Utilities
python-dotenv = "^1.0.0"
pydantic-extra-types = "^2.5.0"

[tool.poetry.group.dev.dependencies]
# Development tools
ipython = "^8.20.0"
pytest-watch = "^4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["services"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ['py311']